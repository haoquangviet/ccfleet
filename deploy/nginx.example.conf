# =============================================================================
# fleet.example.com — ccfleet web UI behind nginx (TLS reverse proxy)
#
# The app binds 127.0.0.1:<port> (`ccfleet web port` prints it; `ccfleet run` with "web": {"enabled": true}).
# Replace <port> below with that number, and fleet.example.com / the certificate paths with your own
# (certbot --nginx -d fleet.example.com can fill in the certificate lines).
# Auth lives in the app (password + TOTP, lockout, audit log). Sessions run with bypassed
# permissions, so this page is effectively shell access: TLS only, never port-forward <port> directly.
# =============================================================================
server {
    listen 80;
    server_name fleet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fleet.example.com;

    ssl_certificate     /etc/ssl/fleet.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/fleet.example.com/privkey.pem;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # project file uploads are a raw body of up to 100 MB
    client_max_body_size 100m;

    location = /api/files/upload {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:<port>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:<port>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # the chat view long-polls
        proxy_buffering off;
    }
}
